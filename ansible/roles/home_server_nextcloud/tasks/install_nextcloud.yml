- name: Create Nextcloud user
  ansible.builtin.user:
    name: "{{ nextcloud_user }}"
    groups: docker
    comment: "Nextcloud service user"
    shell: /usr/sbin/nologin
    system: yes
    create_home: yes #TODO: Do not create?
    home: "{{ nextcloud_path }}"
  become: true

- name: Ensure Nextcloud directory exists
  ansible.builtin.file:
    path: "{{ nextcloud_path }}"
    state: directory
    owner: "{{ nextcloud_user }}"
    group: "{{ nextcloud_user }}"
    mode: '0750'
  become: true

- name: Check if storage data directory exists
  ansible.builtin.stat:
    path: "{{ nextcloud_data_directory }}"
  register: data_directory_status
  become: true

- name: Verify storage data directory exists
  ansible.builtin.assert:
    that:
      - data_directory_status.stat.exists
      - data_directory_status.stat.isdir
    fail_msg: "Required directory {{ nextcloud_data_directory }} does not exist!"
  become: true

- name: Copy Nextcloud configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ nextcloud_user }}"
    group: "{{ nextcloud_user }}"
    mode: '0750' #TODO: Check
  loop:
    - { src: docker-compose.yml.j2, dest: "{{ nextcloud_path }}/docker-compose.yml" }
    - { src: .env.j2, dest: "{{ nextcloud_path }}/.env" }
  notify: Enable and restart Nextcloud
  become: true

- name: Copy Nextcloud systemd config
  ansible.builtin.template:
    src: nextcloud.service.j2
    dest: /etc/systemd/system/nextcloud.service
    owner: root
    group: root
    mode: '0640'
  notify: Enable and restart Nextcloud
  become: true
